default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("PROMO_DB_USER", "promo_user") %>
  password: <%= ENV.fetch("PROMO_DB_PASSWORD", "promo_pass_2026") %>
  host: <%= ENV.fetch("PROMO_DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PROMO_DB_PORT", 3306) %>

development:
  <<: *default
  database: promotion_playground_development

test:
  <<: *default
  database: promotion_playground_test

production:
  <<: *default
  database: <%= ENV.fetch("PROMO_DB_NAME", "promotion_playground_production") %>
